<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2a0f3a">
<title>夜市彈珠王</title>
<link rel="icon" href="icon.png">
<style>
  /* 直式遊戲：畫面比例 9:19.5，依螢幕高度放到最大；手機直接滿版 */
  html, body { margin: 0; height: 100%; background: radial-gradient(ellipse at 50% 30%, #6a2a7a 0%, #2a0f3a 60%, #12061c 100%); overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; color: #fff; }
  #wrap { position: relative; box-shadow: 0 0 60px rgba(255, 200, 80, .35); }
  #unity-canvas { width: 100%; height: 100%; display: block; background: #c8e0ff; }
  #load { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: linear-gradient(#ffd96a, #ff9a3c); color: #6a1a05; text-align: center; padding: 24px; box-sizing: border-box; }
  #load h1 { margin: 0; font-size: clamp(34px, 9vw, 54px); letter-spacing: 2px; color: #fff; text-shadow: 0 3px 0 #b8320f, 0 6px 14px rgba(120, 20, 0, .45); }
  #bar { width: 72%; height: 18px; border-radius: 9px; background: rgba(120, 30, 0, .25); overflow: hidden; }
  #fill { width: 0; height: 100%; background: linear-gradient(90deg, #ff3d3d, #ffe14d); transition: width .2s; }
  #tip { font-size: 15px; opacity: .85; line-height: 1.6; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="load">
    <h1>夜市彈珠王</h1>
    <div id="bar"><div id="fill"></div></div>
    <div id="tip">載入中…第一次大約 30MB，建議用 Wi-Fi<br>手機請直拿，點畫面就有聲音</div>
  </div>
</div>
<script>
  var B = "Build/Web";
  var canvas = document.getElementById("unity-canvas");
  // 大小：手機（直的、窄）→ 整個螢幕；電腦 → 依高度放一個 9:19.5 的直式框（遊戲 UI 依寬度縮放，任何直式比例都能玩）
  function fit() {
    var w = window.innerWidth, h = window.innerHeight, wrap = document.getElementById("wrap");
    if (w / h < 0.62) { wrap.style.width = w + "px"; wrap.style.height = h + "px"; }
    else { var ww = Math.floor(h * 9 / 19.5); wrap.style.width = ww + "px"; wrap.style.height = h + "px"; }
  }
  fit(); window.addEventListener("resize", fit);
  var s = document.createElement("script");
  s.src = B + ".loader.js";
  s.onload = function () {
    createUnityInstance(canvas, {
      dataUrl: B + ".data.unityweb",
      frameworkUrl: B + ".framework.js.unityweb",
      codeUrl: B + ".wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "BluePudding", productName: "夜市彈珠王", productVersion: "0.6",
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)   // 手機解析度太高會卡，最多 2 倍
    }, function (p) {
      document.getElementById("fill").style.width = (p * 100) + "%";
    }).then(function () {
      document.getElementById("load").style.display = "none";
    }).catch(function (e) {
      document.getElementById("tip").innerText = "載入失敗：" + e + "\n請換 Chrome 或 Safari 再試一次";
    });
  };
  document.body.appendChild(s);
</script>
</body>
</html>
